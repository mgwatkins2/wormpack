name: Resourcepack Zipper

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create ZIP file
      run: |
        ZIP_NAME="RP.zip"
        echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
        zip -r "${ZIP_NAME}" . -x "*.git*" ".github/*"

    - name: Upload artifact (optional)
      uses: actions/upload-artifact@v4
      with:
        name: resource-pack
        path: ${{ env.ZIP_NAME }}

    - name: Create or Update Latest Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: latest
        name: Latest Resource Pack
        files: ${{ env.ZIP_NAME }}
        overwrite: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Print direct download link
      run: echo "https://github.com/${{ github.repository }}/releases/latest/download/${{ env.ZIP_NAME }}"
